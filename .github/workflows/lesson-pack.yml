name: Lesson pack

# Builds the offline lesson pack (docs/03, docs/12): published lessons only,
# no database, no secrets. The zip is uploaded as a workflow artifact for the
# creator to download and check. Handing a pack to schools is the creator's
# decision; this workflow never attaches it to a release or publishes it.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: lesson-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Build the offline lesson pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate lessons before packing
        run: pnpm validate:content
      - name: Build the pack (published lessons only)
        run: pnpm pack:lessons
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-pack
          path: |
            dist/lesson-pack-*.zip
            dist/lesson-pack-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
